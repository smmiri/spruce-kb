# Build the public MkDocs site and publish to GitHub Pages.
# Canonical URL: https://spruce.smmiri.com/
#
# FIRST-TIME SETUP (fixes configure-pages "Get Pages site failed" / site 404):
#   Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Custom domain: spruce.smmiri.com (CNAME spruce → smmiri.github.io, DNS only)
#   Then re-run this workflow (Actions → Deploy to GitHub Pages → Run workflow).
#
# Local review:
#   mkdocs serve
#   Open http://127.0.0.1:8000/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages on first run if Settings → Pages was never set to Actions.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
