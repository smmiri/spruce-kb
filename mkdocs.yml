site_name: Spruce Knowledge Base
site_description: Educational knowledge base for defined-risk options operating process
site_author: Spruce
site_url: https://spruce.smmiri.com/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  custom_dir: overrides

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fa
          name: فارسی
          build: true
          site_description: پایگاه دانش آموزشی برای کار با defined-risk options
          copyright: >
            توصیه مالی نیست. Spruce یک پایگاه دانش آموزشی است.
            Licensed under Apache-2.0.
          theme:
            language: fa
            font:
              text: Vazirmatn
              code: Roboto Mono
          nav_translations:
            Home: خانه
            Meta: دربارهٔ سایت
            Disclaimer: سلب مسئولیت
            How to use this site: چطور از این سایت استفاده کنید
            Sources: منابع
            Foundations: مبانی
            Glossary: Glossary
            Options basics: مبانی آپشن
            Single-option payoffs: Payoff تک‌آپشن
            Greeks enough to operate: Greeks لازم برای کار
            Weekly vs monthly: Weekly یا monthly
            Credit-spread payoffs: Payoff مربوط به credit spread
            Risk management: مدیریت ریسک
            Ways to manage risk: راه‌های مدیریت ریسک
            Compare strategies (example): مقایسهٔ استراتژی‌ها با مثال
            Risk policy proposal: پیش‌نویس سیاست ریسک
            Credit-spread playbooks: Playbook مربوط به credit spread
            Defined-risk credit spreads: Credit spread از نوع defined-risk
            Put credit spread playbook: Playbook مربوط به PCS
            Call credit spread playbook: Playbook مربوط به CCS
            Canadian accounts: حساب‌های کانادایی
            Canadian brokers: کارگزارهای کانادایی
            TFSA options constraints: محدودیت options در TFSA
            Cash vs margin: Cash یا margin
            Operating checklists: چک‌لیست عملیات
            HITL and dry-run: انسان در حلقه
            Worked example long call: مثال long call
            Worked example PCS: مثال PCS
            Beginner selection scorecard: برگهٔ انتخاب مبتدی
            Example scored watchlist: نمونهٔ واچ‌لیست امتیازدهی‌شده
            Watchlist and selection: واچ‌لیست و انتخاب
            Operating: عملیات
            Worked examples: مثال‌ها

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap
  - stylesheets/extra.css

extra:
  social: []

copyright: >
  Not financial advice. Spruce is an educational knowledge base.
  Licensed under Apache-2.0.

nav:
  - Home: index.md
  - Meta:
      - Disclaimer: 00-meta/disclaimer.md
      - How to use this site: 00-meta/how-to-use-this-site.md
      - Sources: 00-meta/sources.md
  - Foundations:
      - Glossary: 01-foundations/glossary.md
      - Options basics: 01-foundations/options-basics.md
      - Single-option payoffs: 01-foundations/single-option-payoffs.md
      - Greeks enough to operate: 01-foundations/greeks-enough-to-operate.md
      - Weekly vs monthly: 01-foundations/expirations-weekly-monthly.md
      - Credit-spread payoffs: 01-foundations/payoff-diagrams-credit-spreads.md
  - Watchlist and selection:
      - Beginner selection scorecard: 02-watchlist-and-valuation/beginner-selection-scorecard.md
      - Example scored watchlist: 02-watchlist-and-valuation/example-scored-watchlist.md
  - Risk management:
      - Ways to manage risk: 04-portfolio-and-risk/risk-management-categories.md
      - Compare strategies (example): 04-portfolio-and-risk/comparing-strategies-example.md
      - Risk policy proposal: 04-portfolio-and-risk/risk-policy.md
  - Credit-spread playbooks:
      - Defined-risk credit spreads: 03-strategies/defined-risk-credit-spreads.md
      - Put credit spread playbook: 03-strategies/put-credit-spread-playbook.md
      - Call credit spread playbook: 03-strategies/call-credit-spread-playbook.md
  - Canadian accounts:
      - Canadian brokers: 05-canadian-accounts/canadian-brokers.md
      - TFSA options constraints: 05-canadian-accounts/tfsa-options-constraints.md
      - Cash vs margin: 05-canadian-accounts/cash-vs-margin.md
  - Operating:
      - Checklists: 06-operating-playbooks/operating-checklists.md
      - HITL and dry-run: 07-automation-concepts/human-in-the-loop.md
  - Worked examples:
      - Long call (anonymized): 08-worked-examples/example-long-call.md
      - Put credit spread (anonymized): 08-worked-examples/example-pcs.md
